spring.application.name=auth-service

# Database connection and schema validation
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${AUTH_DB_SCHEMA:auth}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${AUTH_DB_SCHEMA:auth}
spring.flyway.schemas=${AUTH_DB_SCHEMA:auth}
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

# Optional one-time Tutor provisioning. All three values must be supplied together.
bootstrap.tutor.email=${BOOTSTRAP_TUTOR_EMAIL:}
bootstrap.tutor.password=${BOOTSTRAP_TUTOR_PASSWORD:}
bootstrap.tutor.full-name=${BOOTSTRAP_TUTOR_FULL_NAME:}

server.port=8081

# Health endpoint visibility
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Browser origins and TLS are deployment concerns; no production origin is hard-coded here.
security.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:false}
