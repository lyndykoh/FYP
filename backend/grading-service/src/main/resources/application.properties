spring.application.name=grading-service
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Server configuration
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=${GRADING_DB_URL}
spring.datasource.username=${GRADING_DB_USERNAME}
spring.datasource.password=${GRADING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only verifies entity compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${GRADING_DB_SCHEMA:grading}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${GRADING_DB_SCHEMA:grading}
spring.flyway.schemas=${GRADING_DB_SCHEMA:grading}
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Auth-service and grading-service validate the same signed identity contract.
jwt.secret=${JWT_SECRET}

# External AI provider configuration
ai.engine.url=${AI_ENGINE_URL}
ai.engine.model=${AI_ENGINE_MODEL}
ai.engine.api-key=${AI_ENGINE_API_KEY}
ai.vision.model=${AI_VISION_MODEL}
# Metrics remain aggregate-only in both rollout cohorts. This opt-in flag adds a safe
# correlation event without logging uploaded images, OCR text, filenames, or provider bodies.
ai.ocr.observability.enabled=${AI_OCR_OBSERVABILITY_ENABLED:false}

# Submission documents are stored outside the database in an owner-partitioned directory.
document.storage.root=${DOCUMENT_STORAGE_ROOT:./data/submissions}
document.storage.max-file-size-bytes=${DOCUMENT_STORAGE_MAX_FILE_SIZE_BYTES:20971520}
spring.servlet.multipart.max-file-size=${DOCUMENT_UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_UPLOAD_MAX_REQUEST_SIZE:100MB}

# Backend-to-backend key for the durable marking-to-mastery outbox. Never expose this to clients.
learning.service.sync-key=${LEARNING_MARKING_SYNC_KEY}
learning.service.sync.retry-delay-ms=${LEARNING_MARKING_SYNC_RETRY_DELAY_MS:60000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Browser origins and TLS are deployment concerns; no production origin is hard-coded here.
security.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:false}
