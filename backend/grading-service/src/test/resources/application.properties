spring.datasource.url=jdbc:h2:mem:grading-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=PUBLIC
spring.flyway.schemas=PUBLIC
spring.flyway.validate-migration-naming=true
jwt.secret=test-secret-key-that-is-at-least-thirty-two-bytes-long
ai.engine.url=http://localhost/ai-test
ai.engine.model=test-grading-model
ai.engine.api-key=test-api-key
ai.vision.model=test-vision-model
learning.service.sync-key=test-learning-marking-sync-key
document.storage.root=${java.io.tmpdir}/ft-transcendence-grading-test-storage
document.storage.max-file-size-bytes=10485760
