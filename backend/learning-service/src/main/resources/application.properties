spring.application.name=learning-service
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${LEARNING_DB_URL}
spring.datasource.username=${LEARNING_DB_USERNAME}
spring.datasource.password=${LEARNING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JdbcTemplate uses unqualified operational queries. Set the connection search
# path as well as Hibernate/Flyway's schemas so those queries never fall back
# to PostgreSQL's public schema.
spring.datasource.hikari.schema=${LEARNING_DB_SCHEMA:learning}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${LEARNING_DB_SCHEMA:learning}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${LEARNING_DB_SCHEMA:learning}
spring.flyway.schemas=${LEARNING_DB_SCHEMA:learning}
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Auth and learning services validate the same signed identity contract.
jwt.secret=${JWT_SECRET}

# Shared only by grading-service and learning-service; never expose to the frontend.
learning.marking-sync-key=${LEARNING_MARKING_SYNC_KEY}

# Vision OCR is server-side only. The frontend receives review candidates and
# never a provider credential, endpoint, or raw provider response.
ai.vision.enabled=${AI_VISION_ENABLED:false}
ai.vision.url=${AI_VISION_URL:${AI_ENGINE_URL:}}
ai.vision.model=${AI_VISION_MODEL:}
ai.vision.api-key=${AI_VISION_API_KEY:${AI_ENGINE_API_KEY:}}
ai.vision.timeout-ms=${AI_VISION_TIMEOUT_MS:30000}
ai.vision.max-requests-per-minute=${AI_VISION_MAX_REQUESTS_PER_MINUTE:20}
ai.vision.max-attempts=${AI_VISION_MAX_ATTEMPTS:3}
ai.vision.retry-delay-ms=${AI_VISION_RETRY_DELAY_MS:60000}
ai.vision.stale-run-ms=${AI_VISION_STALE_RUN_MS:180000}
ai.vision.worker-delay-ms=${AI_VISION_WORKER_DELAY_MS:5000}

server.port=8083
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Browser origins and TLS are deployment concerns; no production origin is hard-coded here.
security.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:false}
