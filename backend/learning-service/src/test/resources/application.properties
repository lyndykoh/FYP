spring.datasource.url=jdbc:h2:mem:learning-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
jwt.secret=test-secret-key-that-is-at-least-thirty-two-bytes-long
learning.marking-sync-key=test-learning-marking-sync-key
ai.vision.enabled=false
ai.vision.retry-delay-ms=1
ai.vision.worker-delay-ms=600000
