map $http_upgrade $local_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8080;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Nginx can redirect plain HTTP sent to this same TLS port.
    error_page 497 =308 https://localhost:3000$request_uri;
    client_max_body_size 50m;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:3000;
    proxy_set_header X-Forwarded-Host localhost:3000;
    proxy_set_header X-Forwarded-Port 3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $local_connection_upgrade;
    # Do not persist an HSTS policy for local development.
    proxy_hide_header Strict-Transport-Security;

    location ^~ /learning/api/learning/internal/ { return 404; }
    location /auth/ { proxy_pass http://auth-service:8081/; }
    location /learning/ { proxy_pass http://learning-service:8083/; }
    location /grading/ { proxy_pass http://grading-service:8082/; }
    location / { proxy_pass http://frontend:3000; }
}
